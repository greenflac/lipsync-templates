name: CI

# Every branch, not just main. A branch whose checks have only ever run on
# one developer's machine has no second opinion: this repository's own rule
# is that the local check and CI are one source of truth, and that is not
# observable until CI has actually run on the branch being reviewed.
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install -q -r requirements-dev.txt
      - name: Run checks
        run: scripts/check
