name: deploy-connector

# Releases the lipsync-studio connector (docs/CONNECTOR.md) to the VPS, the way green-harness
# releases harness.greenflac.online: guard -> tests -> build and push to GHCR -> deploy the
# DIGEST over SSH to a forced command (deploy/release.sh), health on the VPS (with an MCP
# probe through the OAuth front) and from outside, rollback when it does not answer.
#
# Every third-party action is pinned by its full commit SHA - the same SHAs green-harness's
# deploy.yml pins, proven there on 2026-09-25 with `git ls-remote ... refs/tags/<tag>`:
#   actions/checkout            v7.0.1  3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/setup-python        v7.0.0  5fda3b95a4ea91299a34e894583c3862153e4b97
#   docker/setup-buildx-action  v4.4.1  f87e5991a6d7451dcb8d9637bfbc97413f497069
#   docker/login-action         v4.6.0  dbcb813823bdd20940b903addbd779551569679f
#   docker/build-push-action    v7.4.0  c3c9e263c25d99ce0380d002d59b67737d91b0dc
#
# Secrets (environment `connector`, names only): VPS_HOST, VPS_PORT, VPS_USER, VPS_SSH_KEY,
# VPS_KNOWN_HOSTS - printed by deploy/vps-bootstrap.sh. Variable: STUDIO_DOMAIN.
# GITHUB_TOKEN pushes the image and lets the VPS pull it once.

on:
  push:
    tags: ["connector-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-connector
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/greenflac/lipsync-templates

defaults:
  run:
    shell: bash

jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Only a connector-v* tag on a commit of main may deploy
        run: |
          [ "$GITHUB_REF_TYPE" = tag ] || { echo "::error::deploy from a tag only, not $GITHUB_REF_TYPE $GITHUB_REF_NAME"; exit 1; }
          [[ $GITHUB_REF_NAME =~ ^connector-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag $GITHUB_REF_NAME is not connector-vX.Y.Z"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_SHA is not on main"; exit 1; }

  test:
    needs: guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install -q -r requirements-dev.txt
      # The server's own suite, under the runner that bans the network (rule T4), then the
      # live loopback walk of the whole OAuth path over real HTTP.
      - run: python scripts/run_tests.py studio/mcp/tests
      - run: python scripts/connector_smoke.py

  build:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }},${{ env.IMAGE }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: The digest is what ships
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          [[ $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest from the build: '$DIGEST'"; exit 1; }
          echo "built $IMAGE@$DIGEST"

  deploy:
    needs: [guard, build]
    runs-on: ubuntu-24.04
    environment: connector
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: SSH identity and the pinned host key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then echo "::error::secret $name is not set in environment connector"; exit 1; fi
          done
          port=${VPS_PORT:-22}
          [[ $port =~ ^[0-9]{1,5}$ ]] || { echo "::error::VPS_PORT is not a port number"; exit 1; }
          install -m 700 -d ~/.ssh
          ( umask 077; printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key )
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          {
            echo "Host vps"
            echo "  HostName $VPS_HOST"
            echo "  Port $port"
            echo "  User $VPS_USER"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
            echo "  UserKnownHostsFile ~/.ssh/known_hosts"
            echo "  GlobalKnownHostsFile /dev/null"
            echo "  BatchMode yes"
            echo "  ConnectTimeout 20"
            echo "  ServerAliveInterval 15"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config
      - name: Deploy the digest; health on the VPS; rollback if it does not answer
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_IMAGE: ${{ env.IMAGE }}@${{ needs.build.outputs.digest }}
        run: |
          # shellcheck disable=SC2029
          printf '%s' "$GHCR_TOKEN" | ssh vps deploy "$RELEASE_IMAGE" "$GITHUB_ACTOR"
      - name: Health from outside (DNS, the public certificate, /healthz, the OAuth challenge)
        env:
          STUDIO_DOMAIN: ${{ vars.STUDIO_DOMAIN }}
        run: |
          if [ -z "$STUDIO_DOMAIN" ]; then
            echo "::error::vars.STUDIO_DOMAIN is not set: the release was NOT checked from outside"
            exit 1
          fi
          for i in $(seq 1 12); do
            if sh deploy/probe.sh "https://$STUDIO_DOMAIN"; then
              echo "healthy from outside (poll $i)"; exit 0
            fi
            sleep 5
          done
          echo "::error::https://$STUDIO_DOMAIN does not answer from outside; rolling back"
          ssh vps rollback
          exit 1
      - name: Remove the key from the runner
        if: always()
        run: rm -f ~/.ssh/deploy_key
