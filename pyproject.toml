[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lipsync-templates"
version = "0.1.0"
description = "A client selfie plus a template turns into a vertical video starring the client"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

# Здесь только то, без чего не работает измерительный слой — его тесты
# прогоняются без видеокарты и без сети. Тяжёлое — в extras: insightface
# нужен только живому замеру личности, numpy+pillow хватает всему остальному.
dependencies = [
    "numpy",
    "pillow",
]

[project.optional-dependencies]
identity = ["insightface", "onnxruntime"]
pose = ["mediapipe"]

[tool.setuptools]
packages = ["lipsync", "lipsync.tests"]

[tool.setuptools.package-data]
"lipsync" = ["fixtures/*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Lambda fakes are the standard test double in this suite: a one-line stub
# injected as a parameter. Converting them to defs adds noise, not clarity.
"lipsync/tests/*" = ["E731"]
