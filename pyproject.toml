[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lipsync-templates"
version = "0.1.0"
description = "Пользователь загружает селфи, выбирает шаблон и получает вертикальный ролик, где снимается сам"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

# Здесь только то, без чего не работает измерительный слой — его тесты
# прогоняются без видеокарты и без сети. Тяжёлое — в extras: insightface
# нужен только живому замеру личности, numpy+pillow хватает всему остальному.
dependencies = [
    "numpy",
    "pillow",
]

[project.optional-dependencies]
identity = ["insightface", "onnxruntime"]
pose = ["mediapipe"]

[tool.setuptools]
packages = ["lipsync", "lipsync.tests"]

[tool.setuptools.package-data]
"lipsync" = ["fixtures/*"]
