[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lipsync-templates"
version = "0.1.0"
description = "A client selfie plus a template turns into a vertical video starring the client"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

# Only what the measuring layer cannot run without; its tests need neither
# a GPU nor the network. Heavy packages live in extras: insightface is only
# needed for live identity measurement, numpy+pillow covers everything else.
dependencies = [
    "numpy",
    "pillow",
]

[project.optional-dependencies]
identity = ["insightface", "onnxruntime"]
pose = ["mediapipe"]

[tool.setuptools]
packages = ["lipsync", "lipsync.tests"]

[tool.setuptools.package-data]
"lipsync" = ["fixtures/*"]

[tool.ruff]
line-length = 100

# Data, not code. `ruff format <directory>` skips these on its own, but
# `ruff format path/to/set.jsonl` FORCES the file to be parsed as Python and
# rewrites it into unparseable output — OBSERVED 2026-08-26, when a 39-row
# control set was turned into 386 lines of wreckage by one explicit path. The
# fixture had to be rebuilt. An exclusion makes the accident impossible instead
# of relying on everyone remembering.
# An exclusion alone does NOT stop an explicitly-passed path: ruff reformatted
# the fixture anyway with `extend-exclude` set, and only `force-exclude` made
# the exclusion apply to a file named on the command line (MEASURED 2026-08-26,
# both ways, on a copy).
force-exclude = true
extend-exclude = [
    "*.jsonl",
    "*.json",
    "studio/fixtures/",
    "studio/selfrag/fixtures/",
    "studio/knowledge/",
]

[tool.ruff.lint.per-file-ignores]
# Lambda fakes are the standard test double in this suite: a one-line stub
# injected as a parameter. Converting them to defs adds noise, not clarity.
"lipsync/tests/*" = ["E731"]
